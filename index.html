<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IB MYP5 Math Drill Engine — Formula Practice</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="title-block">
    <h1>IB MYP5 Math Drill Engine</h1>
    <p class="subtitle">Infinite formula-based question generator · Area · Perimeter · Volume · Surface Area</p>
  </div>
</header>

<section class="controls">
  <div class="control-group">
    <label for="topic-filter">Topic</label>
    <select id="topic-filter">
      <option value="all">All topics</option>
      <option value="parallelogram">Parallelogram</option>
      <option value="triangle">Triangle</option>
      <option value="trapezium">Trapezium</option>
      <option value="circle">Circle</option>
      <option value="cylinder">Cylinder</option>
      <option value="sphere">Sphere</option>
      <option value="cone">Cone</option>
      <option value="pyramid">Pyramid</option>
      <option value="cuboid">Cuboid</option>
      <option value="prism">Prism</option>
      <option value="mixed">Mixed / Multi-step</option>
    </select>
  </div>
  <div class="control-group">
    <label for="set-size">Questions per set</label>
    <select id="set-size">
      <option value="12" selected>12</option>
      <option value="20">20</option>
      <option value="30">30</option>
      <option value="50">50</option>
    </select>
  </div>
  <button id="generate-btn" class="primary">Generate New Set</button>
  <button id="reveal-all-btn">Reveal All</button>
  <button id="hide-all-btn">Hide All</button>
</section>

<main id="questions" class="questions"></main>

<footer>
  <p>Set <span id="set-counter">1</span> · Total questions generated: <span id="total-counter">0</span></p>
</footer>

<script src="script.js"></script>
</body>
</html>
