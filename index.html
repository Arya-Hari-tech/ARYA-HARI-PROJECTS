<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IB MYP Language & Literature — Task 1 Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c222b;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #1f6feb;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header h1 span {
    color: var(--muted);
    font-weight: 400;
    margin-left: 8px;
    font-size: 13px;
  }
  .timer {
    font-family: "SF Mono", Monaco, monospace;
    font-size: 20px;
    padding: 6px 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent);
    min-width: 100px;
    text-align: center;
  }
  .timer.warn { color: var(--warn); border-color: var(--warn); }
  .timer.danger { color: var(--bad); border-color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.6; } }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    height: calc(100vh - 60px);
  }
  .panel {
    background: var(--bg);
    overflow-y: auto;
    padding: 22px 26px;
  }
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-track { background: var(--panel); }
  .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .set-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .set-meta h2 { font-size: 15px; color: var(--accent); }
  .set-meta .badge {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .text-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .text-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    font-style: italic;
  }
  .text-body {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    font-size: 15px;
    white-space: pre-line;
    line-height: 1.75;
  }

  .question-block {
    margin-bottom: 22px;
  }
  .q-label {
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .q-label .marks {
    font-size: 12px;
    color: var(--muted);
    background: var(--panel-2);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .q-text { color: var(--muted); margin-bottom: 8px; font-size: 14px; }
  .quote {
    background: var(--panel);
    border-left: 3px solid var(--accent);
    padding: 8px 12px;
    margin-bottom: 8px;
    font-style: italic;
    font-size: 13px;
    color: #c9d1d9;
    border-radius: 0 4px 4px 0;
  }

  textarea {
    width: 100%;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    min-height: 110px;
    line-height: 1.6;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
  }
  .counter {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-top: 4px;
  }

  .feedback {
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 13px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback .score {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .feedback .score.full { color: var(--good); }
  .feedback .score.partial { color: var(--warn); }
  .feedback .score.low { color: var(--bad); }
  .feedback ul { padding-left: 18px; margin-top: 4px; color: var(--muted); }
  .feedback ul li.ok { color: var(--good); list-style: none; margin-left: -18px; }
  .feedback ul li.miss { color: var(--bad); list-style: none; margin-left: -18px; }

  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }
  button {
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.15s;
  }
  button:hover { background: var(--panel-2); border-color: var(--accent); }
  button.primary { background: var(--accent-2); border-color: var(--accent-2); color: white; }
  button.primary:hover { background: var(--accent); border-color: var(--accent); }
  button:active { transform: translateY(1px); }

  .total-score {
    margin-top: 14px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    text-align: center;
    font-size: 14px;
    display: none;
  }
  .total-score.show { display: block; }
  .total-score .num {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
</style>
</head>
<body>
<header>
  <h1>IB MYP Language &amp; Literature <span>Task 1 — Text Analysis Simulator</span></h1>
  <div class="timer" id="timer">15:00</div>
</header>

<main>
  <section class="panel" id="textPanel">
    <div class="set-meta">
      <h2 id="setLabel">Set 1 of 3</h2>
      <span class="badge" id="setGenre">Prose</span>
    </div>
    <div class="text-title" id="textTitle"></div>
    <div class="text-sub" id="textSub"></div>
    <div class="text-body" id="textBody"></div>
  </section>

  <section class="panel">
    <div class="question-block">
      <div class="q-label">Question 1a <span class="marks">/ 3 marks</span></div>
      <div class="q-text" id="q1aText"></div>
      <textarea id="answer1a" placeholder="Write your response here..."></textarea>
      <div class="counter"><span id="count1a">0</span> characters</div>
      <div class="feedback" id="feedback1a"></div>
    </div>

    <div class="question-block">
      <div class="q-label">Question 1b <span class="marks">/ 2 marks</span></div>
      <div class="q-text" id="q1bText"></div>
      <div class="quote" id="q1bQuote"></div>
      <textarea id="answer1b" placeholder="Analyse the effect of the quoted phrase..."></textarea>
      <div class="counter"><span id="count1b">0</span> characters</div>
      <div class="feedback" id="feedback1b"></div>
    </div>

    <div class="controls">
      <button class="primary" id="submitBtn">Submit</button>
      <button id="nextBtn">Next Set</button>
      <button id="resetBtn">Reset Answers</button>
    </div>

    <div class="total-score" id="totalScore">
      Total: <span class="num" id="totalNum">0 / 5</span>
    </div>
  </section>
</main>

<script>
const SETS = [
  {
    title: "The Old Lighthouse",
    sub: "Extract from a short story",
    genre: "Prose Fiction",
    text:
`The lighthouse stood alone on the jagged cliff, its white paint peeling like dried skin in the salt wind.
Below, the sea churned restlessly, hammering the rocks with the patience of a thousand winters.
Maren climbed the spiral stairs, her boots echoing against the cold iron, each step a heartbeat in the silence.
At the top, the lamp had not been lit in seven years, yet the glass still gleamed faintly in the moonlight.
She thought of her father, of the storms he had outlasted, of the ships he had guided home through the dark.
"You are not gone," she whispered, "only waiting."`,
    q1a: "Identify the purpose and significance of the description of the lighthouse in the opening two lines.",
    q1b: "Analyse the effect of the simile used to describe the peeling paint.",
    quote: '"its white paint peeling like dried skin in the salt wind"'
  },
  {
    title: "The Crowd at Dawn",
    sub: "Extract from a journalistic feature",
    genre: "Non-Fiction",
    text:
`At first light, the square was already a living thing — breathing, shifting, murmuring in a hundred tongues.
Vendors unfolded their stalls like sleepy birds spreading their wings, while the smell of roasted chestnuts crept through the cold morning.
Children darted between legs and baskets, laughing without reason, chased only by the rising sun.
An old man sat alone on a bench, watching the chaos with quiet, knowing eyes.
He had seen this square empty during the war, and full again in peace, and empty once more in winter.
Now, it was full, and that, to him, was a small and stubborn miracle.`,
    q1a: "Identify the significance of describing the square as 'a living thing' in the opening line.",
    q1b: "Analyse the effect of the simile comparing vendors to 'sleepy birds spreading their wings'.",
    quote: '"Vendors unfolded their stalls like sleepy birds spreading their wings"'
  },
  {
    title: "The Letter Never Sent",
    sub: "Extract from a literary novel",
    genre: "Prose Fiction",
    text:
`Eli folded the letter carefully, as though the paper itself could shatter if he was careless with it.
He had written it in the small hours, when honesty came easier and the city outside was a quiet, indifferent stranger.
Each word had been chosen, then doubted, then chosen again, leaving the page bruised with crossings-out.
He slid it into the drawer beside the others — twelve in total now, all addressed to her, none ever sent.
Tomorrow, he told himself, as he had told himself for three years.
Tomorrow, the words would feel light enough to carry.`,
    q1a: "Identify the purpose of describing Eli's careful folding of the letter at the start of the passage.",
    q1b: "Analyse the effect of the phrase 'leaving the page bruised with crossings-out'.",
    quote: '"leaving the page bruised with crossings-out"'
  },
  {
    title: "The Last Train",
    sub: "Extract from a contemporary short story",
    genre: "Prose Fiction",
    text:
`The platform was almost empty, save for a flickering lamp that buzzed like a trapped insect.
Sara clutched her ticket so tightly that the corners had begun to soften and curl.
Somewhere behind her, a clock ticked with the dull persistence of an unfinished thought.
She had said goodbye an hour ago, but her feet still refused to move from the painted yellow line.
The train was late. The train was always late. Tonight, she was glad of it.
For as long as it did not arrive, the leaving had not yet truly begun.`,
    q1a: "Identify the significance of the description of the platform in the opening line.",
    q1b: "Analyse the effect of the simile comparing the lamp to 'a trapped insect'.",
    quote: '"a flickering lamp that buzzed like a trapped insect"'
  }
];

let currentSet = 0;
let timerInterval;
let timeLeft = 15 * 60;

const $ = id => document.getElementById(id);

function loadSet(i) {
  const s = SETS[i];
  $("setLabel").textContent = `Set ${i + 1} of ${SETS.length}`;
  $("setGenre").textContent = s.genre;
  $("textTitle").textContent = s.title;
  $("textSub").textContent = s.sub;
  $("textBody").textContent = s.text;
  $("q1aText").textContent = s.q1a;
  $("q1bText").textContent = s.q1b;
  $("q1bQuote").textContent = s.quote;
  resetAnswers();
}

function resetAnswers() {
  $("answer1a").value = "";
  $("answer1b").value = "";
  $("count1a").textContent = "0";
  $("count1b").textContent = "0";
  $("feedback1a").classList.remove("show");
  $("feedback1b").classList.remove("show");
  $("totalScore").classList.remove("show");
}

const TECHNIQUE_WORDS = [
  "simile", "metaphor", "personification", "imagery", "symbol", "symbolism",
  "alliteration", "hyperbole", "juxtaposition", "contrast", "repetition",
  "diction", "tone", "syntax", "structure", "description", "adjective",
  "verb", "comparison", "phrase", "language", "device"
];
const EFFECT_WORDS = [
  "tension", "unease", "fear", "isolation", "loneliness", "loss", "grief",
  "nostalgia", "hope", "warmth", "calm", "peace", "anxiety", "discomfort",
  "vivid", "atmosphere", "mood", "emphasis", "emphasises", "emphasizes",
  "highlights", "evokes", "creates", "establishes", "reinforces", "contrast",
  "fragility", "stillness", "decay", "memory", "longing", "permanence", "time"
];
const DEEPER_WORDS = [
  "suggests", "implies", "implies that", "represents", "symbolises",
  "symbolizes", "reflects", "conveys", "reveals", "indicates",
  "signifies", "embodies", "alludes", "foreshadows", "hints",
  "reminiscent", "metaphorically"
];
const PURPOSE_WORDS = [
  "purpose", "introduces", "establishes", "sets", "setting", "context",
  "character", "theme", "atmosphere", "mood", "tone", "significance",
  "important", "function", "role"
];

function lower(s) { return s.toLowerCase(); }
function hasAny(text, list) {
  const t = lower(text);
  return list.some(w => t.includes(w));
}
function hasAnyMatched(text, list) {
  const t = lower(text);
  return list.filter(w => t.includes(w));
}

function markQ1a(answer) {
  const trimmed = answer.trim();
  if (trimmed.length < 15) {
    return { score: 0, max: 3, items: [{ ok: false, msg: "Answer is too short — develop your response." }] };
  }
  let score = 0;
  const items = [];

  const purpose = hasAny(trimmed, PURPOSE_WORDS);
  if (purpose) { score++; items.push({ ok: true, msg: "Identifies a clear purpose or function." }); }
  else { items.push({ ok: false, msg: "Missing reference to purpose / significance (e.g. 'introduces', 'establishes')." }); }

  const effect = hasAny(trimmed, EFFECT_WORDS);
  if (effect) { score++; items.push({ ok: true, msg: "Mentions an effect, theme, or atmosphere." }); }
  else { items.push({ ok: false, msg: "Missing an effect word (e.g. tension, mood, atmosphere)." }); }

  const deeper = hasAny(trimmed, DEEPER_WORDS);
  if (deeper) { score++; items.push({ ok: true, msg: "Shows deeper meaning ('suggests' / 'implies' / 'reflects')." }); }
  else { items.push({ ok: false, msg: "Missing deeper meaning — try 'suggests', 'implies', or 'reflects'." }); }

  return { score, max: 3, items };
}

function markQ1b(answer, quote) {
  const trimmed = answer.trim();
  if (trimmed.length < 15) {
    return { score: 0, max: 2, items: [{ ok: false, msg: "Answer is too short — develop your response." }] };
  }
  let score = 0;
  const items = [];

  const technique = hasAny(trimmed, TECHNIQUE_WORDS);
  const effect = hasAny(trimmed, EFFECT_WORDS);
  const deeper = hasAny(trimmed, DEEPER_WORDS);

  if (technique && effect) {
    score++;
    items.push({ ok: true, msg: "Identifies the technique and an associated effect." });
  } else if (technique) {
    items.push({ ok: false, msg: "Technique mentioned but no clear effect (e.g. tension, unease)." });
  } else if (effect) {
    items.push({ ok: false, msg: "Effect mentioned but no technique (e.g. simile, imagery)." });
  } else {
    items.push({ ok: false, msg: "Missing technique AND effect." });
  }

  const refUsed = checkReference(trimmed, quote);
  if (refUsed && deeper) {
    score++;
    items.push({ ok: true, msg: "Refers to the quoted phrase and explores deeper meaning." });
  } else if (!refUsed) {
    items.push({ ok: false, msg: "No reference to the quoted phrase — quote or paraphrase it." });
  } else if (!deeper) {
    items.push({ ok: false, msg: "Missing deeper meaning ('suggests', 'implies', 'conveys')." });
  }

  return { score, max: 2, items };
}

function checkReference(answer, quote) {
  const a = lower(answer);
  if (a.includes('"') || a.includes("'") || a.includes("quote")) return true;
  const cleaned = quote.replace(/["']/g, "").toLowerCase();
  const words = cleaned.split(/\s+/).filter(w => w.length > 4);
  let hits = 0;
  for (const w of words) if (a.includes(w)) hits++;
  return hits >= 2;
}

function renderFeedback(el, result) {
  const pct = result.score / result.max;
  const cls = pct === 1 ? "full" : pct >= 0.5 ? "partial" : "low";
  let html = `<div class="score ${cls}">Score: ${result.score} / ${result.max}</div><ul>`;
  for (const it of result.items) {
    html += `<li class="${it.ok ? "ok" : "miss"}">${it.ok ? "✓ " : "✗ "}${it.msg}</li>`;
  }
  html += "</ul>";
  el.innerHTML = html;
  el.classList.add("show");
}

function submit() {
  const a1 = $("answer1a").value;
  const a2 = $("answer1b").value;
  const r1 = markQ1a(a1);
  const r2 = markQ1b(a2, SETS[currentSet].quote);
  renderFeedback($("feedback1a"), r1);
  renderFeedback($("feedback1b"), r2);
  $("totalNum").textContent = `${r1.score + r2.score} / 5`;
  $("totalScore").classList.add("show");
}

function nextSet() {
  currentSet = (currentSet + 1) % SETS.length;
  loadSet(currentSet);
}

function updateTimer() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  $("timer").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  const t = $("timer");
  t.classList.remove("warn", "danger");
  if (timeLeft <= 60) t.classList.add("danger");
  else if (timeLeft <= 300) t.classList.add("warn");
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    submit();
    return;
  }
  timeLeft--;
}

function startTimer() {
  timeLeft = 15 * 60;
  updateTimer();
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
}

$("answer1a").addEventListener("input", e => $("count1a").textContent = e.target.value.length);
$("answer1b").addEventListener("input", e => $("count1b").textContent = e.target.value.length);
$("submitBtn").addEventListener("click", submit);
$("nextBtn").addEventListener("click", nextSet);
$("resetBtn").addEventListener("click", resetAnswers);

loadSet(0);
startTimer();
</script>
</body>
</html>
